name: Build Blender ARM64 package

on:
  schedule:
    - cron: "31 5 * * *"
  workflow_dispatch:
    inputs:
      version:
        description: "Published stable Blender version (empty = latest stable)"
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: blender-linux-arm64-release
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    permissions:
      contents: write # See drafts left by interrupted publication, too.
    outputs:
      version: ${{ steps.release.outputs.version }}
      tag: ${{ steps.release.outputs.tag }}
      source_sha: ${{ steps.release.outputs.source_sha }}
      build: ${{ steps.release.outputs.build }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate discovery tests
        run: python3 -m unittest discover -s blender-build -p 'test_*.py' -v
      - name: Discover published stable release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_VERSION: ${{ inputs.version }}
        run: python3 blender-build/discover.py --version "$REQUESTED_VERSION"

  dependencies:
    needs: discover
    if: needs.discover.outputs.build == 'true'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 360
    env:
      BLENDER_VERSION: ${{ needs.discover.outputs.version }}
      BLENDER_SOURCE_SHA: ${{ needs.discover.outputs.source_sha }}
      # Fixed path across runners: CMake/ExternalProject caches contain absolute paths.
      BLENDER_WORK_DIR: /home/runner/blender-arm64
    steps:
      - uses: actions/checkout@v4
      - name: Prepare pinned source and host prerequisites
        run: bash blender-build/build.sh prepare
      - name: Restore completed dependency bundle
        id: bundle
        uses: actions/cache/restore@v4
        with:
          path: /home/runner/blender-arm64/transfer
          key: blender-arm64-noble-deps-v1-${{ needs.discover.outputs.source_sha }}-${{ hashFiles('blender-build/build.sh', 'blender-build/ubuntu-packages.txt') }}
      - name: Restore resumable dependency work
        if: steps.bundle.outputs.cache-hit != 'true'
        uses: actions/cache/restore@v4
        with:
          path: |
            /home/runner/blender-arm64/dependencies
            /home/runner/blender-arm64/dependency-sources
            /home/runner/blender-arm64/lib
          key: blender-arm64-noble-work-v1-${{ needs.discover.outputs.source_sha }}-${{ hashFiles('blender-build/build.sh', 'blender-build/ubuntu-packages.txt') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            blender-arm64-noble-work-v1-${{ needs.discover.outputs.source_sha }}-${{ hashFiles('blender-build/build.sh', 'blender-build/ubuntu-packages.txt') }}-
      - name: Build pinned ARM64 dependencies
        if: steps.bundle.outputs.cache-hit != 'true'
        id: compile
        # Exit before the job limit so the partial build has time to be cached.
        run: timeout --signal=TERM --kill-after=60s 270m bash blender-build/build.sh dependencies
      - name: Save incomplete dependency work for retry
        if: always() && steps.compile.outcome == 'failure'
        uses: actions/cache/save@v4
        with:
          path: |
            /home/runner/blender-arm64/dependencies
            /home/runner/blender-arm64/dependency-sources
            /home/runner/blender-arm64/lib
          key: blender-arm64-noble-work-v1-${{ needs.discover.outputs.source_sha }}-${{ hashFiles('blender-build/build.sh', 'blender-build/ubuntu-packages.txt') }}-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Cache completed dependency bundle
        if: steps.bundle.outputs.cache-hit != 'true' && success()
        uses: actions/cache/save@v4
        with:
          path: /home/runner/blender-arm64/transfer
          key: blender-arm64-noble-deps-v1-${{ needs.discover.outputs.source_sha }}-${{ hashFiles('blender-build/build.sh', 'blender-build/ubuntu-packages.txt') }}
      - name: Transfer dependencies to Blender build job
        uses: actions/upload-artifact@v4
        with:
          name: blender-arm64-dependencies
          path: /home/runner/blender-arm64/transfer/dependencies.tar.zst
          compression-level: 0
          retention-days: 2
          if-no-files-found: error

  build:
    needs: [discover, dependencies]
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 360
    env:
      BLENDER_VERSION: ${{ needs.discover.outputs.version }}
      BLENDER_SOURCE_SHA: ${{ needs.discover.outputs.source_sha }}
      BLENDER_WORK_DIR: /home/runner/blender-arm64
    steps:
      - uses: actions/checkout@v4
      - name: Prepare pinned source and host prerequisites
        run: bash blender-build/build.sh prepare
      - uses: actions/download-artifact@v4
        with:
          name: blender-arm64-dependencies
          path: /home/runner/blender-arm64/transfer
      - name: Extract dependency bundle
        run: tar -I zstd -xf "$BLENDER_WORK_DIR/transfer/dependencies.tar.zst" -C "$BLENDER_WORK_DIR"
      - name: Build optimized Blender and smoke-test CPU rendering
        run: bash blender-build/build.sh blender
      - name: Package binaries, source, provenance, and checksums
        run: bash blender-build/build.sh package
      - uses: actions/upload-artifact@v4
        with:
          name: blender-arm64-release
          path: /home/runner/blender-arm64/dist/*
          compression-level: 0
          retention-days: 2
          if-no-files-found: error

  publish:
    needs: [discover, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: blender-arm64-release
          path: dist
      - name: Publish durable GitHub Release without replacing public assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.discover.outputs.tag }}
          VERSION: ${{ needs.discover.outputs.version }}
          SOURCE_SHA: ${{ needs.discover.outputs.source_sha }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$TAG" --json isDraft > release.json; then
            if [[ $(jq -r .isDraft release.json) == false ]]; then
              echo "Release $TAG already published; leaving it unchanged."
              exit 0
            fi
          else
            # API/auth errors fail creation rather than silently treating an error as success.
            cat > notes.md <<EOF
          Unofficial native Ubuntu 24.04 ARM64 source build of Blender $VERSION.
          Source commit: https://github.com/blender/blender/commit/$SOURCE_SHA
          CPU baseline: ARMv8.2-A with dotprod, fp16 and LSE; glibc >= 2.39.
          CPU Cycles is smoke-tested; no GPU is required. GPU kernel toolchains are not bundled.
          Verify the binary with its .sha256 file or verify all assets with SHA256SUMS.
          Corresponding Blender/dependency source and build recipes are in sources.tar.zst.part-*:
          concatenate the parts in filename order and extract with tar --zstd -xf -.
          This is not an official Blender Foundation binary. See BUILD-INFO.txt for provenance.
          EOF
            gh release create "$TAG" --draft --latest=false --target "$GITHUB_SHA" \
              --title "Blender $VERSION — Linux ARM64" --notes-file notes.md
          fi
          (cd dist; sha256sum -c SHA256SUMS)
          # Retry-safe while draft; never replace an already-published release.
          gh release upload "$TAG" dist/* --clobber
          gh release edit "$TAG" --draft=false --latest=false
