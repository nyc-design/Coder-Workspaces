name: Rebuild base-dev when stale

# base-dev only builds when something under workspace-images/base-dev changes,
# so with no pushes it (and everything it installs at "latest": code-server,
# VS Code Web, apt packages, the AI CLIs) just ages. This checks daily and
# starts a build once the last successful one is MAX_AGE_DAYS old. The child
# images rebuild through their existing workflow_run triggers on base-dev.
#
# The build is a fresh one rather than a cache replay because build-base-dev
# passes an ISO-week CACHE_EPOCH build arg (see the base-dev Dockerfile).

on:
  schedule:
    - cron: "30 5 * * *"
  workflow_dispatch:

permissions:
  actions: write

env:
  BUILD_WORKFLOW: build-base-dev.yaml
  MAX_AGE_DAYS: 7

jobs:
  rebuild-if-stale:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch a base-dev build if the last successful one is too old
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          # A build already queued or running will produce a fresh image.
          active=$(gh run list --workflow "$BUILD_WORKFLOW" --branch main --limit 20 \
            --json status --jq '[.[] | select(.status != "completed")] | length')
          if [ "$active" -gt 0 ]; then
            echo "A base-dev build is already in progress; nothing to do."
            exit 0
          fi

          last=$(gh run list --workflow "$BUILD_WORKFLOW" --branch main --status success --limit 1 \
            --json createdAt --jq '.[0].createdAt // empty')
          if [ -n "$last" ]; then
            age_days=$(( ($(date -u +%s) - $(date -u -d "$last" +%s)) / 86400 ))
            echo "Last successful base-dev build: $last (${age_days}d ago; limit ${MAX_AGE_DAYS}d)"
            if [ "$age_days" -lt "$MAX_AGE_DAYS" ]; then
              exit 0
            fi
          else
            echo "No successful base-dev build found."
          fi

          gh workflow run "$BUILD_WORKFLOW" --ref main
          echo "Dispatched $BUILD_WORKFLOW on main."
