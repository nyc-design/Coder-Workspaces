# MCP server configs for Coder Agents (chatd).
# Synced to /api/experimental/mcp/servers by update-coder-agents-config.yaml.
#
# Stable identity: `slug` (must be unique within the deployment).
# Additive: manually-added MCP servers in admin UI are not deleted by sync.
#
# `${VAR}` placeholders are substituted at sync time from workflow env.
#
# Coder Agents form fields → YAML mapping:
#   Display name                   display_name
#   Slug                           slug
#   Server URL                     url
#   Transport                      transport (streamable_http | sse)
#   Description                    description
#   Authentication method          auth_type (none | api_key | custom_headers | oauth2 | user_oidc)
#     API Key                      api_key_header + api_key_value (when auth_type=api_key)
#     Custom Headers               custom_headers (map, when auth_type=custom_headers)
#     OAuth2                       oauth2_* fields (when auth_type=oauth2)
#   Enabled                        enabled (BOOL — must be true on POST or server is created disabled
#                                  and won't be reachable; PATCH treats absence as no-change)
#   Availability                   availability (force_on | default_on | default_off)
#                                  separate from enabled — controls whether the tool is ON for new
#                                  chats by default; enabled controls whether the server exists at all.
#   Allow all tools in root        allow_in_plan_mode (BOOL)
#     plan mode                    Only consulted while a chat is in plan mode. Outside plan mode every
#                                  server is available regardless. In a ROOT chat in plan mode, only
#                                  servers with this set survive the filter. In a SUBAGENT in plan mode
#                                  external MCP servers are stripped entirely and this flag has no
#                                  effect — hence "root" in the UI label. Per-server, not per-tool:
#                                  enabling it exposes every tool the server offers, including
#                                  mutating ones. See coderd/x/chatd/chatd.go
#                                  filterExternalMCPConfigsForTurn.
#   Forward Coder headers          forward_coder_headers (BOOL)
#                                  Adds X-Coder-Owner-Id / -Chat-Id / -Subchat-Id / -Workspace-Id to
#                                  every outgoing request so the server can correlate a tool call back
#                                  to the originating chat. Leaks chat identity, so upstream defaults
#                                  it off and documents it as first-party / trusted servers only.
#
# NOTE: both flags default to false server-side and PATCH treats an absent field
# as no-change, so anything set in the admin GUI but omitted here persists
# invisibly. Declare them explicitly on every server so this file stays the
# source of truth.

mcp_servers:
  - slug: context7
    display_name: Context7
    description: Up-to-date library / framework / SDK / CLI documentation and code examples.
    icon_url: /icon/code.svg
    transport: streamable_http
    url: https://mcp.context7.com/mcp
    auth_type: custom_headers
    custom_headers:
      CONTEXT7_API_KEY: ${CONTEXT7_API_KEY}
    enabled: true
    availability: default_on
    allow_in_plan_mode: true
    forward_coder_headers: false

  - slug: grep
    display_name: Grep
    description: Search public GitHub repositories for code examples by keyword/path/language.
    icon_url: /icon/sourcegraph-amp.svg
    transport: streamable_http
    url: https://mcp.grep.app
    auth_type: none
    enabled: true
    availability: default_on
    allow_in_plan_mode: true
    forward_coder_headers: false

  - slug: github
    display_name: GitHub
    description: 'GitHub: list/search repos, read files, manage issues + PRs, run Actions. Use to find the matching repo when the user describes a project before creating a workspace.'
    icon_url: /icon/github.svg
    transport: streamable_http
    url: https://api.githubcopilot.com/mcp/
    auth_type: custom_headers
    custom_headers:
      Authorization: Bearer ${GH_PAT_FOR_MCP}
    enabled: true
    availability: default_on
    allow_in_plan_mode: true
    forward_coder_headers: false

  - slug: omniroute
    display_name: OmniRoute
    description: 'OmniRoute: manage providers, combos, model aliases, API keys, policies, rate limits, and routing strategies. Read audit logs, inspect usage/cost, run evals, and trigger compression engines (Caveman/RTK). Read/write OmniRoute memory + skills.'
    icon_url: /icon/widgets.svg
    transport: streamable_http
    url: https://omniroute.tapiavala.com/api/mcp/stream
    auth_type: custom_headers
    custom_headers:
      x-api-key: ${LLM_GATEWAY_API_KEY}
    enabled: true
    availability: default_off
    allow_in_plan_mode: true
    forward_coder_headers: false

  - slug: agentmemory
    display_name: AgentMemory
    description: 'Per-project persistent memory: save observations, recall via smart search, list/audit sessions, manage lessons + sentinels. Always pass `project` derived from the repo (basename of `git remote get-url origin .git`) so memory scopes per repo and survives workspace recreate.'
    icon_url: /icon/database.svg
    transport: streamable_http
    url: https://memory.tapiavala.com/mcp
    auth_type: custom_headers
    custom_headers:
      Authorization: Bearer ${AGENTMEMORY_SECRET}
    enabled: true
    availability: default_on
    allow_in_plan_mode: true
    forward_coder_headers: true

  # Trusted clients share authenticated public retrieval access.
  # force_on makes retrieval available wherever proxy compression is in use.
  - slug: headroom
    display_name: Headroom
    description: Recover original tool output from Headroom compression references.
    icon_url: /icon/database.svg
    transport: streamable_http
    url: https://llm.tapiavala.com/mcp
    auth_type: custom_headers
    custom_headers:
      Authorization: Bearer ${HEADROOM_MCP_SECRET}
    enabled: true
    availability: force_on
    allow_in_plan_mode: true
    forward_coder_headers: false

  # MCPProxy (smart-mcp-proxy/mcpproxy-go) fronting XcodeBuildMCP on the
  # MacBook Pro, reachable only over the Tailscale tailnet. Notes:
  #   - `X-API-Key` is mcpproxy's own auth header (not XcodeBuildMCP's); the
  #     value is mcpproxy's `api_key` from ~/.mcpproxy/mcp_config.json.
  #   - `/mcp/all` bypasses mcpproxy's retrieve_tools search and exposes every
  #     upstream tool directly, so the full XcodeBuildMCP surface lands in the
  #     chat. That is why this is default_off rather than default_on: it is a
  #     large tool set, it is only relevant to Apple-platform work, and the Mac
  #     is not always awake. Toggle it on per chat when doing Xcode work.
  #   - Availability depends on the laptop being online and joined to the
  #     tailnet; expect connection errors when it is asleep.
  - slug: xcodebuildmcp
    display_name: XcodeBuildMCP
    description: 'Native Xcode tooling on the MacBook Pro over Tailscale: build, test, run, and debug iOS/macOS targets, drive simulators and devices, inspect schemes and build settings. Requires the Mac to be awake and on the tailnet.'
    icon_url: /icon/code.svg
    transport: streamable_http
    url: https://neils-macbook-pro.tail8f5bea.ts.net/mcp/all
    auth_type: custom_headers
    custom_headers:
      X-API-Key: ${XCODEBUILDMCP_API_KEY}
    enabled: true
    availability: default_off
    allow_in_plan_mode: true
    forward_coder_headers: true
