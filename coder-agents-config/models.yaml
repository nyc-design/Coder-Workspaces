# Chat model configs for Coder Agents (chatd).
# Synced to /api/experimental/chats/model-configs by update-coder-agents-config.yaml.
#
# Stable identity: `(provider, model)` tuple. This file is declarative: models
# missing from this YAML are deleted from Coder on sync.
#
# `provider:` here is the provider NAME from providers.yaml (e.g. "anthropic").
# sync.sh resolves it to the new `ai_provider_id` UUID required by the server
# at push time, so YAML stays human-readable while the wire payload conforms
# to the post-DEVEX-227 chat model config schema.
#
# Model IDs here are live OmniRoute model IDs from `GET /v1/models`.
# Cost values are USD per 1M tokens in Coder's model_config.cost schema,
# sourced from LiteLLM's public pricing map
# (BerriAI/litellm model_prices_and_context_window.json) for the underlying
# model tier. These are display/estimate values: the cliproxy-*
# paths are subscription-OAuth-backed (Claude Pro/Max, ChatGPT/Codex), so
# actual billing is the flat subscription, not per-token.
#
# The meridian/* Claude entries were removed on 2026-09-12; the full prior
# file is preserved at backups/models.yaml.2026-09-12.bak (not read by
# sync.sh, which only loads the exact filenames above).
#
# context_limit values are the live `context_length` reported by OmniRoute.
# compression_threshold is a percentage of context; Alibaba targets ~200k tokens,
# capped at 90% for smaller windows. Other providers retain their existing settings.

models:
  # ── Claude Code subscription paths (Anthropic Messages API) ────────────────

  - provider: anthropic
    model: cliproxy-claude/claude-fable-5
    display_name: Claude Fable 5 — CLIProxyAPI Claude Code
    enabled: true
    is_default: true
    context_limit: 1000000
    compression_threshold: 30
    model_config:
      reasoning_effort:
        default: high
        max: max
      cost:
        input_price_per_million_tokens: "10"
        output_price_per_million_tokens: "50"
        cache_read_price_per_million_tokens: "1"
        cache_write_price_per_million_tokens: "12.5"
      provider_options:
        anthropic:
          send_reasoning: true
          web_search_enabled: true

